# Профиль BreakProject для нашей сборки Grim simfix11.
# Каждая включённая проверка имеет отдельный счётчик; окно — 300 секунд.
# N:M — первый запуск на N активных флагах, затем на N+M, N+2M и т. д.
# Это количество флагов, НЕ секундный cooldown. 1:1 — каждое срабатывание.
# [log] сохраняет нарушение в БД и /grim history.
# Без [log]: Simulation, GroundSpoof, NoFall и все разновидности Timer.
# BadPackets: 5:5 [log] и 5:5 [alert]; остальные включённые проверки: 1:1 [log].
# Reach/Hitboxes: 1:1 [alert]; прочие уведомления — реже.
# Удалять шумные проверки из checks не нужно: это отключит их.
# Бан-команды Reach/Hitboxes сохранены из пользовательского конфига.
# Заменить СУЩЕСТВУЮЩИЙ punishments.yml целиком, не добавлять к старым группам.
# Подробности и необходимые настройки: README.ru.md рядом с этим файлом.

Punishments:
  Simulation:
    remove-violations-after: 300
    checks:
      - "Simulation"
    commands:
      - "300:300 [alert]"
      - "1000:1000 [webhook]"
      - "1000:1000 [proxy]"

  GroundSpoof:
